version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: load2ask_postgres
    restart: always
    environment:
      POSTGRES_USER: load2ask
      POSTGRES_PASSWORD: load2ask_password
      POSTGRES_DB: load2ask_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U load2ask -d load2ask_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: load2ask_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: load2ask_backend
    restart: always
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://load2ask:load2ask_password@postgres:5432/load2ask_db
      - VECTOR_STORE_PROVIDER=qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=load2ask_documents
      - UPLOAD_DIRECTORY=/app/uploads
      - LLM_API_KEY=${LLM_API_KEY:-default_llm_key}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-default_embedding_key}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: load2ask_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
