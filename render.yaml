services:
  - type: web
    name: load2ask-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "65536"
      - key: VECTOR_STORE_PROVIDER
        value: qdrant
      - key: QDRANT_COLLECTION
        value: load2ask_documents
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: local
